<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="WIREFRAME">
  <defs>
    <linearGradient id="wf-g" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0D58A"/>
      <stop offset="1" stop-color="#B8892B"/>
    </linearGradient>
  </defs>
  <!-- poles with crossarms -->
  <path d="M9 10v30M39 10v30M4.5 13h9M34.5 13h9" stroke="url(#wf-g)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- chord between the supports -->
  <path d="M9 13h30" stroke="url(#wf-g)" stroke-width="1" stroke-dasharray="1.4 2.1" opacity=".5"/>
  <!-- catenary span -->
  <path d="M9 13C15 24.8 33 24.8 39 13" stroke="url(#wf-g)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- perpendicular sag to the lowest point -->
  <path d="M24 13v8.2" stroke="url(#wf-g)" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="24" cy="21.9" r="1.9" fill="url(#wf-g)"/>
  <!-- spectral trace: frequency rises toward the centre and falls again -->
  <path d="M14 33.5c1.4-3 2.8-3 3.6 0s1.7 2.6 2.3 0 1.2-2.3 1.7 0 1 2.3 1.5 0 .9-2.3 1.5 0 1.1 2.3 1.7 0 1.4-2.6 2.3 0 2.2 3 3.6 0"
        stroke="url(#wf-g)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- insulators -->
  <circle cx="9" cy="13" r="2.2" fill="#0C0D0F" stroke="url(#wf-g)" stroke-width="1.6"/>
  <circle cx="39" cy="13" r="2.2" fill="#0C0D0F" stroke="url(#wf-g)" stroke-width="1.6"/>
</svg>
