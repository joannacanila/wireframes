<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WIREFRAME Admin</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0c0d0f">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/assets/admin.css">
</head>
<body class="adm">
  <header class="adm-top" id="top" hidden>
    <a class="adm-brand" href="/admin" data-link><img src="/assets/logo.svg" alt="" width="24" height="24"><span>WIREFRAME</span><em>Admin</em></a>
    <nav class="adm-nav" aria-label="Command centre">
      <a href="/admin" data-link data-nav="overview">Overview</a>
      <a href="/admin/analyses" data-link data-nav="analyses">Analyses</a>
      <a href="/admin/sites" data-link data-nav="sites">Sites</a>
      <a href="/admin/poles" data-link data-nav="poles">Poles</a>
      <a href="/admin/models" data-link data-nav="models">Models &amp; queue</a>
      <a href="/admin/exports" data-link data-nav="exports">Exports</a>
      <a href="/admin/evaluation" data-link data-nav="evaluation">Evaluation</a>
    </nav>
    <span class="mode-pill" id="mode-pill" data-mode="checking">Checking…</span>
    <div class="adm-user"><span id="who"></span><button class="btn" id="signout">Sign out</button></div>
  </header>
  <main id="view" class="adm-view" tabindex="-1"></main>
  <ol class="toaster" id="toaster" aria-live="polite" aria-label="Notifications"></ol>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script type="module" src="/assets/admin.js"></script>
</body>
</html>
