<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WIREFRAME Admin</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f3f2ef">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin="">
  <link rel="stylesheet" href="/assets/styles.css?v=2.23">
  <link rel="stylesheet" href="/assets/admin.css?v=2.23">
  <!-- light by default (readable in daylight and on projectors); the choice is remembered per browser -->
  <script>try { const t = localStorage.getItem("wf-admin-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body class="adm">
  <a class="skip" href="#view">Skip to content</a>
  <header class="adm-top" id="top" hidden>
    <a class="adm-brand" href="/admin" data-link aria-label="WIREFRAME admin, dashboard"><img src="/assets/logo.svg" alt="" width="22" height="22"><span>WIREFRAME</span></a>
    <nav class="adm-nav" aria-label="Main">
      <a href="/admin" data-link data-nav="dashboard">Dashboard</a>
      <a href="/admin/inspections" data-link data-nav="inspections">Inspections</a>
      <a href="/admin/map" data-link data-nav="map">Map &amp; Dispatch</a>
    </nav>
    <span class="adm-spacer"></span>
    <a class="adm-alert" id="sys-alert" href="/admin" data-link hidden></a>
    <button class="adm-asst" id="asst-open" type="button" aria-expanded="false" aria-controls="asst-panel" title="WIREFRAME Assistant">
      <img src="/assets/logo.svg" alt="" width="16" height="16"><span>Assistant</span></button>
    <button class="adm-theme" id="theme-btn" type="button" aria-label="Switch to dark theme" title="Day / night">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
    <div class="adm-menu">
      <button class="adm-user" id="user-btn" type="button" aria-expanded="false" aria-controls="user-menu"><span class="avatar" id="avatar" aria-hidden="true"></span><span class="who" id="who"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="adm-pop" id="user-menu" hidden>
        <p class="adm-pop-id"><b id="who-full"></b><span id="who-role"></span></p>
        <a href="/workspace" target="_blank" rel="noopener">Field Screener</a>
        <button type="button" id="signout">Sign out</button>
      </div>
    </div>
  </header>
  <main id="view" class="adm-view" tabindex="-1"></main>
  <ol class="toaster" id="toaster" aria-live="polite" aria-label="Notifications"></ol>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" crossorigin=""></script>
  <script type="module" src="/assets/notice.js?v=2.23"></script>
  <script type="module" src="/assets/admin.js?v=2.23"></script>
</body>
</html>
